<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Il tuo Garmin</title>
<style>
:root{
  --bg:#f2f2f7; --surface:#ffffff; --surface-2:#f2f2f7;
  --label:#1c1c1e; --label-2:#55555a; --separator:#d8d8de;
  --accent:#0060df; --accent-soft:#e3eeff;
  --good:#1a7f37; --warn:#9a5b00; --bad:#c4251c;
  --good-soft:#e1f4e6; --warn-soft:#fdf0d5; --bad-soft:#fde4e2;
  --bar:#0060df; --bar-2:#5e5ce6; --grid:#e5e5ea;
  --z-low:#f3cf86; --z-ok:#86d39f; --z-high:#f2a49c;
  --s-deep:#3634a3; --s-core:#007aff; --s-rem:#32ade6; --s-awake:#ff9f0a;
  --radius:20px; --gap:16px;
  --spring:cubic-bezier(.2,.9,.25,1);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e;
    --label:#f2f2f7; --label-2:#aeaeb4; --separator:#3a3a3e;
    --accent:#4da3ff; --accent-soft:#12263f;
    --good:#4cd371; --warn:#ffb340; --bad:#ff7a70;
    --good-soft:#12301b; --warn-soft:#3a2a08; --bad-soft:#3d1512;
    --bar:#4da3ff; --bar-2:#9a98ff; --grid:#2f2f33;
    --z-low:#8a6a24; --z-ok:#2f8a50; --z-high:#9a453c;
    --s-deep:#7d7aff; --s-core:#0a84ff; --s-rem:#64d2ff; --s-awake:#ff9f0a;
  }
}
@media (prefers-contrast: more){
  :root{ --label-2:#3a3a3e; --separator:#8e8e93; }
  @media (prefers-color-scheme: dark){ :root{ --label-2:#d1d1d6; } }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--label);
  font-family:-apple-system,BlinkMacSystemFont,system-ui,"Inter","Segoe UI",Roboto,sans-serif;
  font-optical-sizing:auto;
  font-size:1.0625rem; line-height:1.4; font-variant-numeric:tabular-nums;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.wrap{max-width:1200px; margin:0 auto; padding:24px 20px 40px}
header{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:8px 24px; padding:16px 4px 20px}
h1{font-size:2.125rem; line-height:1.12; font-weight:700; margin:0; letter-spacing:-0.022em}
.sub{color:var(--label-2); font-size:.9375rem; margin:6px 0 0; line-height:1.35}
.upd{color:var(--label-2); font-size:.8125rem; text-align:right; line-height:1.4}
.upd b{color:var(--label); font-weight:600}
.notice{
  display:flex; gap:12px; align-items:flex-start; background:var(--warn-soft); color:var(--label);
  border-radius:16px; padding:14px 16px; margin-bottom:var(--gap); font-size:.9375rem; line-height:1.4;
}
.notice .ic{flex:none; width:24px; height:24px; border-radius:50%; background:var(--warn); color:var(--surface);
  font-weight:700; display:grid; place-items:center; font-size:.875rem}
.notice strong{font-weight:600}
.card{background:var(--surface); border-radius:var(--radius); padding:20px 22px; min-width:0}
.card h2{font-size:1.25rem; line-height:1.2; margin:0 0 4px; font-weight:600; letter-spacing:-0.01em}
.card .lead{color:var(--label-2); font-size:.9375rem; line-height:1.4; margin:0 0 14px}
.eyebrow{font-size:.8125rem; line-height:1.35; color:var(--label-2); font-weight:500}
.grid{display:grid; gap:var(--gap); margin-bottom:var(--gap)}
.kpis{grid-template-columns:repeat(4,1fr)}
.kpi{padding:18px 20px}
.kpi .val{font-size:2.125rem; font-weight:700; line-height:1.1; margin:6px 0 10px; letter-spacing:-0.022em}
.kpi .val small{font-size:1rem; font-weight:500; color:var(--label-2); margin-left:3px; letter-spacing:0}
.chip{display:inline-flex; align-items:center; gap:4px; font-size:.8125rem; font-weight:600; padding:3px 9px; border-radius:999px; background:var(--surface-2); color:var(--label-2)}
.chip .ar{font-size:.625rem}
.kpi .prev{display:block; color:var(--label-2); font-size:.8125rem; margin-top:8px}
.two{grid-template-columns:5fr 7fr} .two-b{grid-template-columns:7fr 5fr}
.load-main{display:flex; align-items:center; gap:14px; margin-bottom:6px; flex-wrap:wrap}
.ratio{font-size:3rem; font-weight:700; line-height:1; letter-spacing:-0.03em}
.light{display:inline-flex; align-items:center; gap:8px; padding:6px 12px 6px 10px; border-radius:999px; font-weight:600; font-size:.9375rem}
.light i{width:12px; height:12px; border-radius:50%; background:currentColor; display:block}
.light.ottimale{background:var(--good-soft); color:var(--good)}
.light.alto{background:var(--bad-soft); color:var(--bad)}
.light.basso{background:var(--warn-soft); color:var(--warn)}
.gauge{margin:18px 0 6px}
.gauge .track{position:relative; height:12px; border-radius:6px; display:flex}
.gauge .z{height:100%}
.gauge .z1{background:var(--z-low); border-radius:6px 0 0 6px}
.gauge .z2{background:var(--z-ok)}
.gauge .z3{background:var(--z-high); border-radius:0 6px 6px 0}
.gauge .pin{position:absolute; top:-5px; left:0; width:6px; height:22px; background:var(--label); border-radius:3px; box-shadow:0 0 0 3px var(--surface)}
.gauge .ticks{font-size:.75rem; color:var(--label-2); margin-top:8px; position:relative; height:16px}
.gauge .ticks span{position:absolute; transform:translateX(-50%)}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:.8125rem; color:var(--label-2); margin-top:12px}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:10px; height:10px; border-radius:3px; display:block}
.stats{display:flex; gap:24px; margin-top:16px; padding-top:14px; border-top:1px solid var(--separator); flex-wrap:wrap}
.stats div{font-size:.8125rem; color:var(--label-2)}
.stats b{display:block; font-size:1.25rem; color:var(--label); font-weight:600; letter-spacing:-0.01em}
svg{display:block; overflow:visible}
svg text{font-family:inherit; fill:var(--label-2); font-size:11px}
.chart{position:relative; width:100%; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none}
.chart svg{width:100%; touch-action:pan-y; cursor:crosshair}
.chart svg:focus{outline:none}
.chart svg:focus-visible{outline:3px solid var(--accent); outline-offset:4px; border-radius:6px}
.readout{position:absolute; top:0; left:0; pointer-events:none; white-space:nowrap;
  background:var(--surface); color:var(--label); border-radius:10px; padding:5px 10px; font-size:.8125rem; line-height:1.3;
  box-shadow:0 2px 10px rgba(0,0,0,.14), 0 0 0 .5px rgba(0,0,0,.08); opacity:0; transition:opacity .12s ease}
.readout.on{opacity:1}
.readout b{font-weight:600; font-size:.9375rem}
.readout span{color:var(--label-2); display:block}
.bar{transition:opacity .15s ease}
.scrubbing .bar{opacity:.35}
.scrubbing .bar.on{opacity:1}
.scrubbing .best{opacity:0}
.mark{opacity:0; transition:opacity .12s ease}
.scrubbing .mark{opacity:1}
.seg{position:relative; display:inline-flex; background:var(--surface-2); border-radius:10px; padding:2px; margin-bottom:12px}
.seg .thumb{position:absolute; top:2px; left:0; height:calc(100% - 4px); border-radius:8px; background:var(--surface);
  box-shadow:0 1px 3px rgba(0,0,0,.16), 0 0 0 .5px rgba(0,0,0,.06); will-change:transform}
.seg button{position:relative; font:inherit; font-size:.8125rem; font-weight:500; border:0; background:transparent; color:var(--label);
  padding:6px 14px; border-radius:8px; cursor:pointer; min-height:32px; -webkit-tap-highlight-color:transparent;
  transition:transform .1s ease-out, opacity .1s ease-out}
.seg button:active{transform:scale(.95); opacity:.7}
.seg button[aria-pressed="true"]{font-weight:600}
.seg button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
summary{-webkit-tap-highlight-color:transparent; transition:opacity .1s ease-out}
summary:active{opacity:.55}
.wb{grid-template-columns:repeat(4,1fr); gap:12px}
.ph{display:flex; height:14px; border-radius:7px; overflow:hidden; gap:2px; margin:4px 0 10px}
.ph i{display:block; height:100%; min-width:3px}
.phl{display:grid; gap:4px}
.phl span{display:block}
.phl i{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px}
.phl em{font-style:normal; opacity:.9}
.tile .cmp{font-size:.75rem; color:var(--label-2); line-height:1.4; margin:0 0 8px}
.tile .cmp b{color:var(--label); font-weight:600}
.recnotes{margin:14px 0 0; padding:0 0 0 18px; color:var(--label-2); font-size:.875rem; line-height:1.47}
.recnotes li{margin:2px 0}
.tile{background:var(--surface-2); border-radius:14px; padding:14px; min-width:0}
.tile .nm{font-size:.8125rem; color:var(--label-2); font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tile .v{font-size:1.5rem; font-weight:700; line-height:1.15; margin:2px 0 6px; letter-spacing:-0.015em}
.tile .v small{font-size:.8125rem; font-weight:500; color:var(--label-2); letter-spacing:0}
.tile.live .v{color:var(--accent)}
.empty{font-size:.9375rem; color:var(--label-2); margin:14px 0 0; line-height:1.4}
.empty:empty{display:none}
.list{width:100%; border-collapse:collapse; font-size:.9375rem}
.list th{text-align:left; font-size:.75rem; font-weight:600; color:var(--label-2); padding:0 10px 8px 0; border-bottom:1px solid var(--separator); white-space:nowrap}
.list td{padding:11px 10px 11px 0; border-bottom:1px solid var(--separator); vertical-align:middle}
.list tr:last-child td{border-bottom:0}
.list .num{text-align:right; white-space:nowrap}
.list th.num{text-align:right}
.tag{display:inline-block; font-size:.75rem; font-weight:600; padding:2px 8px; border-radius:6px; background:var(--accent-soft); color:var(--accent); white-space:nowrap}
.nm2{font-weight:500}
.alist{display:none; list-style:none; margin:0; padding:0}
.alist li{display:grid; grid-template-columns:1fr auto; gap:2px 12px; padding:12px 0; border-bottom:1px solid var(--separator)}
.alist li:last-child{border-bottom:0}
.alist .t{font-weight:500; line-height:1.3; min-width:0}
.alist .d{font-size:.8125rem; color:var(--label-2); line-height:1.35}
.alist .k{text-align:right; font-weight:600; white-space:nowrap}
.alist .k small{font-weight:500; color:var(--label-2); font-size:.8125rem}
.alist .m{text-align:right; font-size:.8125rem; color:var(--label-2); white-space:nowrap}
.notes{margin:0; padding:0; list-style:none; display:grid; gap:14px}
.notes li{display:flex; gap:12px; font-size:1rem; line-height:1.47}
.notes .dot{flex:none; width:8px; height:8px; border-radius:50%; background:var(--accent); margin-top:9px}
footer{color:var(--label-2); font-size:.8125rem; line-height:1.5; padding:20px 4px 0}
.vh{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
@media (max-width:980px){ .kpis{grid-template-columns:repeat(2,1fr)} .two,.two-b{grid-template-columns:1fr} .wb{grid-template-columns:repeat(2,1fr)} }
@media (max-width:560px){
  .wrap{padding:12px 16px 32px} h1{font-size:1.875rem} .upd{text-align:left}
  .card{padding:18px 16px} .kpi{padding:16px} .kpi .val{font-size:1.75rem} .ratio{font-size:2.5rem}
  .wb{gap:10px} .tile{padding:12px}
  .actwrap{display:none} .alist{display:block}
}
@media (prefers-reduced-motion: reduce){
  .bar,.readout,.mark,.seg button,summary{transition:none}
  .seg button:active{transform:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Il tuo Garmin</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="upd" id="upd"></div>
  </header>

  <div class="notice" id="notice" role="note"><span class="ic" aria-hidden="true">!</span><div id="noticeTxt"></div></div>

  <section class="grid kpis" id="kpis" aria-label="Ultimi 7 giorni"></section>

  <section class="grid two">
    <article class="card" id="loadCard" aria-labelledby="loadT"></article>
    <article class="card" aria-labelledby="weekT">
      <h2 id="weekT">Volume settimanale</h2>
      <p class="lead" id="weekLead"></p>
      <div class="seg" role="group" aria-label="Metrica del grafico">
        <span class="thumb" aria-hidden="true"></span>
        <button type="button" data-m="km" aria-pressed="true">Chilometri</button>
        <button type="button" data-m="dislivello_m" aria-pressed="false">Dislivello</button>
        <button type="button" data-m="ore" aria-pressed="false">Ore</button>
      </div>
      <div class="chart" id="weekChart"></div>
      <div id="weekFoot"></div>
    </article>
  </section>

  <section class="card" style="margin-bottom:var(--gap)" aria-labelledby="recT">
    <h2 id="recT">Recupero</h2>
    <p class="lead" id="recLead"></p>
    <div class="grid wb" id="wb" style="margin-bottom:0"></div>
    <p class="empty" id="recEmpty"></p>
    <ul class="recnotes" id="recNotes"></ul>
  </section>

  <section class="grid two two-b">
    <article class="card" aria-labelledby="actT">
      <h2 id="actT">Ultime 10 attività</h2>
      <p class="lead" id="actLead"></p>
      <div class="actwrap" style="overflow-x:auto">
      <table class="list" id="act">
        <thead><tr><th scope="col">Data</th><th scope="col">Attività</th><th scope="col" class="num">Km</th><th scope="col" class="num">Durata</th><th scope="col" class="num">D+ (m)</th><th scope="col" class="num">FC media</th></tr></thead>
        <tbody></tbody>
      </table>
      </div>
      <ul class="alist" id="alist"></ul>
    </article>
    <article class="card" aria-labelledby="noteT">
      <h2 id="noteT">Cosa notare</h2>
      <p class="lead" id="noteLead">Osservazioni descrittive sui dati disponibili.</p>
      <ul class="notes" id="notes"></ul>
    </article>
  </section>

  <footer id="foot"></footer>
</div>

<script>
const D = /*DATA*/null;
const MESI=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const TIPI={hiit:'HIIT',indoor_cycling:'Bici indoor',gravel_cycling:'Gravel',hiking:'Escursione',running:'Corsa',multi_sport:'Multisport',cycling:'Bici',trail_running:'Trail running',walking:'Camminata',road_biking:'Bici su strada',lap_swimming:'Nuoto in vasca'};
const $=s=>document.querySelector(s);
const nf=(v,d=0)=>v==null?'n.d.':Number(v).toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtD=iso=>{const [y,m,d]=iso.slice(0,10).split('-');return `${+d} ${MESI[+m-1]} ${y}`};
const fmtS=iso=>{const [y,m,d]=iso.slice(0,10).split('-');return `${+d} ${MESI[+m-1]}`};
const fmtDur=min=>{const h=Math.floor(min/60),m=Math.round(min%60);return h?`${h} h ${String(m).padStart(2,'0')} min`:`${m} min`};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NS='http://www.w3.org/2000/svg';
const el=(t,a={},txt)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;return e};
const RM=matchMedia('(prefers-reduced-motion: reduce)');

/* Molla smorzata: parte sempre dal valore attuale e conserva la velocità se il bersaglio cambia a metà. */
function spring(set,{response=.35,damping=1,from=0}={}){
  const k=(2*Math.PI/response)**2, c=4*Math.PI*damping/response;
  let x=from, v=0, target=from, raf=0, last=0;
  function step(t){
    const dt=Math.min(.032,Math.max(.001,(t-last)/1000)); last=t;
    v+=(-k*(x-target)-c*v)*dt; x+=v*dt;
    if(Math.abs(v)<.05&&Math.abs(x-target)<.05){x=target;v=0;set(x);raf=0;return}
    set(x); raf=requestAnimationFrame(step);
  }
  return {
    to(t){target=t; if(RM.matches){this.jump(t);return} if(!raf){last=performance.now();raf=requestAnimationFrame(step)}},
    jump(t){cancelAnimationFrame(raf);raf=0;x=target=t;v=0;set(t)}
  };
}

/* Ridisegna un grafico alla larghezza reale del contenitore, così le etichette restano a 11px veri. */
function responsive(box,render){
  let w=0, raf=0;
  const go=()=>{raf=0;const nw=Math.round(box.clientWidth);if(nw&&nw!==w){w=nw;render(w)}};
  new ResizeObserver(()=>{if(!raf)raf=requestAnimationFrame(go)}).observe(box);
  go();
}

/* Scrub: il dito (o il mouse) scorre sul grafico e la lettura lo segue 1:1. Risposta al pointerdown. */
function scrub(svg,n,xAt,show,hide){
  svg.setAttribute('tabindex','0');
  let idx=-1, down=false, t=0;
  const vbw=()=>svg.viewBox.baseVal.width||svg.getBoundingClientRect().width;
  const pick=e=>{const r=svg.getBoundingClientRect(), px=(e.clientX-r.left)*vbw()/r.width;
    let b=0,bd=Infinity;for(let i=0;i<n;i++){const d=Math.abs(xAt(i)-px);if(d<bd){bd=d;b=i}}return b};
  const set=i=>{clearTimeout(t);if(i!==idx){idx=i;svg.classList.add('scrubbing');show(i)}};
  const off=()=>{idx=-1;svg.classList.remove('scrubbing');hide()};
  svg.addEventListener('pointerdown',e=>{down=true;try{svg.setPointerCapture(e.pointerId)}catch(_){}set(pick(e))});
  svg.addEventListener('pointermove',e=>{if(down||e.pointerType==='mouse')set(pick(e))});
  svg.addEventListener('pointerup',e=>{down=false;if(e.pointerType!=='mouse'){clearTimeout(t);t=setTimeout(off,1600)}});
  svg.addEventListener('pointercancel',()=>{down=false;off()});
  svg.addEventListener('pointerleave',e=>{if(!down&&e.pointerType==='mouse')off()});
  svg.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const s=e.key==='ArrowLeft'?-1:1;set(idx<0?n-1:Math.max(0,Math.min(n-1,idx+s)))}
    else if(e.key==='Escape')off();
  });
  svg.addEventListener('blur',off);
}

/* Etichetta flottante sopra al grafico, tenuta dentro i bordi. */
function readout(box){
  const r=document.createElement('div');r.className='readout';r.setAttribute('aria-live','polite');box.appendChild(r);
  return {
    show(x,y,html,top){r.innerHTML=html;const w=r.offsetWidth,h=r.offsetHeight,W=box.clientWidth;
      const left=Math.max(0,Math.min(W-w,x-w/2));r.style.transform=`translate(${left}px,${top!=null?top:Math.max(-h-6,y-h-12)}px)`;r.classList.add('on')},
    hide(){r.classList.remove('on')}
  };
}

const ref=D.data_riferimento, gen=D.generato_il;
$('#sub').textContent=`Allenamento e recupero, ${D.attivita_totali} attività dal ${fmtD(D.intervallo_attivita[0])} al ${fmtD(D.intervallo_attivita[1])}`;
$('#upd').innerHTML=`Pagina generata il <b>${fmtD(gen)}</b><br>Ultimo dato Garmin: <b>${fmtD(ref)}</b>`;
if(D.dati_aggiornati){$('#notice').remove()}else{
  $('#noticeTxt').innerHTML=`<strong>Dati fermi al ${fmtD(ref)}.</strong> ${D.avviso_dati?esc(D.avviso_dati):"Le finestre di 7 e 30 giorni sono calcolate a ritroso dall'ultimo giorno con dati, non da oggi."}`;
}

/* KPI: chip neutri. La freccia dice la direzione, non se è un bene o un male. */
(function(){
  const k=D.kpi['7g'], c=k.corrente, p=k.precedente, v=k.variazione_pct;
  const [a,b]=k.periodo;
  const items=[
    {nm:'Distanza',val:nf(c.km,1),u:'km',pf:nf(p.km,1)+' km',pct:v.km},
    {nm:'Dislivello positivo',val:nf(c.dislivello_m),u:'m',pf:nf(p.dislivello_m)+' m',pct:v.dislivello_m},
    {nm:'Tempo in movimento',val:nf(c.ore,1),u:'ore',pf:nf(p.ore,1)+' ore',pct:v.ore},
    {nm:'Uscite',val:nf(c.uscite),u:'',pf:nf(p.uscite),pct:v.uscite}
  ];
  const box=$('#kpis');
  items.forEach(it=>{
    let chip, a11y;
    if(it.pct==null){chip=`<span class="chip">Nuovo dato</span>`;a11y='nessun confronto possibile'}
    else if(Math.abs(it.pct)<0.5){chip=`<span class="chip">Invariato</span>`;a11y='invariato'}
    else{const up=it.pct>0;chip=`<span class="chip"><span class="ar" aria-hidden="true">${up?'▲':'▼'}</span>${up?'+':'−'}${nf(Math.abs(it.pct),0)}%</span>`;a11y=up?'in aumento':'in calo'}
    const s=document.createElement('article');s.className='card kpi';
    s.innerHTML=`<div class="eyebrow">${it.nm}</div><div class="val">${it.val}<small>${it.u}</small></div>${chip}<span class="vh"> ${a11y} rispetto alla settimana prima</span><span class="prev">Settimana prima: ${it.pf}</span>`;
    box.appendChild(s);
  });
  box.setAttribute('aria-label',`Ultimi 7 giorni, dal ${fmtS(a)} al ${fmtS(b)}`);
})();

/* Carico */
(function(){
  const c=D.carico, r=c.rapporto, sem=c.semaforo;
  const etic={ottimale:'Ottimale',alto:'Alto',basso:'Basso'}[sem]||sem;
  const pct=Math.min(r,2)/2*100;
  const s=c.serie;
  const peak=s.reduce((m,x)=>x.rapporto>m.rapporto?x:m,s[0]);
  const concl={ottimale:'Carico recente in linea con quello abituale',alto:'Carico recente più alto del solito',basso:'Carico recente più basso del solito'}[sem];
  const card=$('#loadCard');
  card.innerHTML=`
    <h2 id="loadT">Carico acuto e cronico</h2>
    <p class="lead">${concl}</p>
    <div class="load-main"><div class="ratio">${nf(r,2)}</div><span class="light ${sem}"><i aria-hidden="true"></i>${etic}</span></div>
    <div class="gauge" role="img" aria-label="Rapporto ${nf(r,2)} su scala da 0 a 2. Zona ottimale tra 0,8 e 1,3. Stato: ${etic}.">
      <div class="track"><div class="z z1" style="width:40%"></div><div class="z z2" style="width:25%"></div><div class="z z3" style="width:35%"></div><div class="pin" id="pin"></div></div>
      <div class="ticks"><span style="left:0%;transform:none">0</span><span style="left:40%">0,8</span><span style="left:65%">1,3</span><span style="left:100%;transform:translateX(-100%)">2+</span></div>
    </div>
    <div class="legend"><span><i style="background:var(--z-low)"></i>Basso &lt; 0,8</span><span><i style="background:var(--z-ok)"></i>Ottimale 0,8 a 1,3</span><span><i style="background:var(--z-high)"></i>Alto &gt; 1,3</span></div>
    <div class="stats"><div><b>${nf(c.acuto_min_die,0)} min</b>acuto, media 7 giorni</div><div><b>${nf(c.cronico_min_die,0)} min</b>cronico, media 28 giorni</div></div>
    <div style="margin-top:16px"><div class="eyebrow" style="margin-bottom:6px">Rapporto negli ultimi ${s.length} giorni</div><div class="chart" id="ratioChart"></div></div>
    <p class="eyebrow" style="margin:10px 0 0">Picco ${nf(peak.rapporto,2)} il ${fmtS(peak.data)}. Tocca o scorri il grafico per leggere i singoli giorni. Indicazione orientativa, calcolata sui minuti di allenamento.</p>`;

  /* Il cursore del gauge arriva dalla sinistra con una molla smorzata. */
  const pin=$('#pin'), track=pin.parentElement;
  const ps=spring(x=>{pin.style.transform=`translateX(${x-3}px)`},{response:.55});
  responsive(track,w=>{ps.jump(0);ps.to(pct/100*w)});

  const box=$('#ratioChart'), ro=readout(box);
  responsive(box,W=>{
    box.querySelector('svg')?.remove();
    const H=118,L=24,R=8,T=10,B=20, iw=W-L-R, ih=H-T-B, ymax=Math.max(2.2,Math.ceil(peak.rapporto*2)/2);
    const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,height:H,role:'img','aria-label':`Andamento del rapporto acuto cronico dal ${fmtS(s[0].data)} al ${fmtS(s[s.length-1].data)}. Ultimo valore ${nf(r,2)}, picco ${nf(peak.rapporto,2)}. Usa le frecce per scorrere i giorni.`});
    const y=v=>T+ih-(v/ymax)*ih, x=i=>L+i/(s.length-1)*iw;
    svg.appendChild(el('rect',{x:L,y:y(1.3),width:iw,height:y(0.8)-y(1.3),fill:'var(--good)',opacity:.16}));
    [0,1,2].forEach(g=>{svg.appendChild(el('line',{x1:L,x2:W-R,y1:y(g),y2:y(g),stroke:'var(--grid)','stroke-width':1}));svg.appendChild(el('text',{x:L-6,y:y(g)+4,'text-anchor':'end'},g))});
    svg.appendChild(el('path',{d:s.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.rapporto).toFixed(1)).join(''),fill:'none',stroke:'var(--accent)','stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'}));
    const li=s.length-1, pi=s.indexOf(peak);
    svg.appendChild(el('circle',{cx:x(li),cy:y(s[li].rapporto),r:4,fill:'var(--accent)',stroke:'var(--surface)','stroke-width':2}));
    svg.appendChild(el('circle',{cx:x(pi),cy:y(peak.rapporto),r:3.5,fill:'var(--surface)',stroke:'var(--bad)','stroke-width':2}));
    const nLab=Math.max(2,Math.min(5,Math.floor(iw/70)));
    for(let j=0;j<nLab;j++){const i=Math.round(j*(li)/(nLab-1));
      svg.appendChild(el('text',{x:x(i),y:H-3,'text-anchor':j===0?'start':(j===nLab-1?'end':'middle')},fmtS(s[i].data)))}
    const rule=el('line',{class:'mark',y1:T,y2:T+ih,stroke:'var(--label-2)','stroke-width':1}), dot=el('circle',{class:'mark',r:4.5,fill:'var(--accent)',stroke:'var(--surface)','stroke-width':2});
    svg.append(rule,dot); box.prepend(svg);
    scrub(svg,s.length,x,i=>{const px=x(i),py=y(s[i].rapporto);
      rule.setAttribute('x1',px);rule.setAttribute('x2',px);dot.setAttribute('cx',px);dot.setAttribute('cy',py);
      ro.show(px,T,`<b>${nf(s[i].rapporto,2)}</b><span>${fmtS(s[i].data)}</span>`)},()=>ro.hide());
  });
})();

/* Grafico settimanale: le barre crescono dall'altezza attuale, anche se cambi metrica a metà. */
(function(){
  const S=D.settimane;
  const cfg={km:{u:'km',t:'Chilometri a settimana',d:1},dislivello_m:{u:'m',t:'Dislivello positivo a settimana',d:0},ore:{u:'ore',t:'Ore a settimana',d:1}};
  const box=$('#weekChart'), foot=$('#weekFoot'), ro=readout(box);
  let cur='km', G=null;

  function scale(m){
    const vals=S.map(x=>x[m]||0), mx=Math.max(...vals);
    const step=m==='dislivello_m'?(mx>1500?500:250):(mx>40?10:(mx>12?5:2));
    return {vals,mx,step,top:Math.max(step,Math.ceil(mx/step)*step)};
  }

  function build(W){
    box.querySelector('svg')?.remove();
    const H=W<480?236:276, L=36,R=6,T=58,B=24, iw=W-L-R, ih=H-T-B, bw=iw/S.length;
    const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,height:H,role:'img'});
    const axis=el('g'), bars=el('g'), labels=el('g'), best=el('text',{class:'best','text-anchor':'middle',style:'fill:var(--label);font-weight:600'});
    svg.append(axis,bars,labels,best);
    box.prepend(svg);
    const stride=Math.max(1,Math.ceil(64/bw));
    S.forEach((w,i)=>{ if((S.length-1-i)%stride)return; const cx=L+i*bw+bw/2; if(cx-24<L-8)return;
      labels.appendChild(el('text',{x:cx,y:H-6,'text-anchor':i===S.length-1?'end':'middle',dx:i===S.length-1?bw/2:0},fmtS(w.settimana)))});
    const base=T+ih;
    const items=S.map((w,i)=>{
      const x=L+i*bw+bw*0.18, ww=Math.max(2,bw*0.64);
      const r=el('rect',{x,y:base,width:ww,height:0,rx:Math.min(3,ww/3),fill:i===S.length-1?'var(--bar-2)':'var(--bar)',class:'bar'});
      const z=el('rect',{x,y:base-2,width:ww,height:2,rx:1,fill:'var(--separator)',opacity:0});
      bars.append(r,z);
      const sp=spring(h=>{r.setAttribute('y',base-h);r.setAttribute('height',Math.max(0,h))},{response:.4});
      return {r,z,sp};
    });
    G={svg,axis,best,items,L,R,W,T,ih,base,bw};
    scrub(svg,S.length,i=>L+i*bw+bw/2,i=>{
      const w=S[i], v=w[cur]||0, c=cfg[cur];
      items.forEach((it,j)=>it.r.classList.toggle('on',j===i));
      const top=scale(cur).top, h=(v/top)*ih;
      ro.show(L+i*bw+bw/2,base-h,`<b>${nf(v,c.d)} ${c.u}</b><span>Sett. dal ${fmtS(w.settimana)} · ${w.uscite} ${w.uscite===1?'uscita':'uscite'}</span>`,0);
    },()=>{ro.hide();items.forEach(it=>it.r.classList.remove('on'))});
  }

  function draw(m,animate){
    cur=m; const c=cfg[m], {vals,mx,step,top}=scale(m), g=G;
    const tot=vals.reduce((a,b)=>a+b,0), bi=vals.indexOf(mx), bestW=S[bi];
    $('#weekLead').textContent=`${nf(tot,c.d)} ${c.u} in ${S.length} settimane. Settimana più alta: ${nf(mx,c.d)} ${c.u}, dal ${fmtS(bestW.settimana)}.`;
    g.svg.setAttribute('aria-label',`${c.t}, ultime ${S.length} settimane. Totale ${nf(tot,c.d)} ${c.u}. Massimo ${nf(mx,c.d)} ${c.u} nella settimana del ${fmtS(bestW.settimana)}. Usa le frecce per scorrere le settimane.`);
    g.axis.innerHTML='';
    const y=v=>g.T+g.ih-(v/top)*g.ih;
    for(let v=0;v<=top;v+=step){g.axis.appendChild(el('line',{x1:g.L,x2:g.W-g.R,y1:y(v),y2:y(v),stroke:'var(--grid)','stroke-width':1}));g.axis.appendChild(el('text',{x:g.L-7,y:y(v)+4,'text-anchor':'end'},nf(v)))}
    vals.forEach((v,i)=>{const h=v>0?Math.max(2,(v/top)*g.ih):0, it=g.items[i];
      animate?it.sp.to(h):it.sp.jump(h); it.z.setAttribute('opacity',v?0:1)});
    if(mx>0){const bx=g.L+bi*g.bw+g.bw/2;g.best.setAttribute('x',Math.max(g.L+12,Math.min(bx,g.W-g.R-14)));g.best.setAttribute('y',y(mx)-7);g.best.textContent=nf(mx,c.d)}else g.best.textContent='';
    foot.innerHTML='';
    const cap=document.createElement('p');cap.className='eyebrow';cap.style.margin='10px 0 0';
    cap.textContent=`Ogni barra è una settimana da lunedì a domenica, l'ultima in viola. Tocca o scorri le barre per i valori.${m==='dislivello_m'?' Il dislivello manca in molte attività: il totale può essere sottostimato.':''}`;
    foot.appendChild(cap);
    const det=document.createElement('details');det.style.marginTop='8px';
    det.innerHTML=`<summary class="eyebrow" style="cursor:pointer">Mostra i valori in tabella</summary>`;
    const tb=document.createElement('table');tb.className='list';tb.innerHTML=`<thead><tr><th>Settimana dal</th><th class="num">${c.u}</th><th class="num">Uscite</th></tr></thead><tbody>`+S.filter(x=>x[m]>0||x.uscite>0).map(x=>`<tr><td>${fmtS(x.settimana)}</td><td class="num">${nf(x[m],c.d)}</td><td class="num">${x.uscite}</td></tr>`).join('')+'</tbody>';
    det.appendChild(tb);foot.appendChild(det);
  }

  /* Segmented control: il cursore scivola con una molla e si può reindirizzare a metà corsa. */
  const seg=$('.seg'), thumb=seg.querySelector('.thumb'), btns=[...seg.querySelectorAll('button')];
  const ts=spring(x=>{thumb.style.transform=`translateX(${x}px)`},{response:.32});
  const place=(b,anim)=>{thumb.style.width=b.offsetWidth+'px';const x=b.offsetLeft;anim?ts.to(x):ts.jump(x)};
  btns.forEach(b=>b.addEventListener('pointerdown',()=>place(b,true)));
  btns.forEach(b=>b.addEventListener('click',()=>{
    btns.forEach(x=>x.setAttribute('aria-pressed',x===b));place(b,true);
    if(b.dataset.m!==cur)draw(b.dataset.m,true)}));
  btns.forEach(b=>b.addEventListener('pointercancel',()=>place(btns.find(x=>x.getAttribute('aria-pressed')==='true'),true)));
  new ResizeObserver(()=>place(btns.find(x=>x.getAttribute('aria-pressed')==='true'),false)).observe(seg);

  let first=true;
  responsive(box,W=>{build(W);draw(cur,false);if(first){first=false;
    /* All'apertura le barre crescono una volta da zero. */
    if(!RM.matches){G.items.forEach(it=>it.sp.jump(0));draw(cur,true)}}});
})();

/* Recupero */
(function(){
  const B=D.benessere, defs=[
    {k:'sonno_ore',nm:B.sonno_stimato?'Sonno (stimato)':'Sonno',u:'ore',d:1,sk:'sonno_ore'},
    {k:'sonno_punteggio',nm:'Punteggio del sonno',u:'su 100',d:0,sk:'sonno_punteggio'},
    {k:'fasi'},
    {k:'fc_riposo',nm:'Battito a riposo',u:'bpm',d:0,sk:'fc_riposo'},
    {k:'spo2',nm:'SpO2 media',u:'%',d:0,sk:'spo2'},
    {k:'hrv',nm:'HRV notturna',u:'ms',d:0,sk:'hrv'},
    {k:'stress',nm:'Stress medio',u:'su 100',d:0,sk:'stress'},
    {k:'body_battery_max',nm:'Body Battery',u:'max',d:0,sk:'body_battery_max'}];
  $('#recLead').textContent=B.disponibile?'Ultimo valore, media a 7 giorni e confronto con le 4 settimane precedenti. Grafici: ultimi 30 giorni, in chiaro la media mobile. Tocca un grafico per leggere il giorno.':'Sonno, HRV, stress e Body Battery';
  const box=$('#wb');
  defs.forEach(df=>{
    const t=document.createElement('div');t.className='tile';
    if(df.k==='fasi'){
      const F=B.fasi_sonno;
      if(F){
        const u=F.ultima_notte_min, tot=u.profondo+u.rem+u.leggero+u.sveglio, m7=F.media_7gg_min;
        const ph=[['profondo','Profondo','var(--s-deep)'],['rem','REM','var(--s-rem)'],['leggero','Leggero','var(--s-core)'],['sveglio','Sveglio','var(--s-awake)']];
        t.innerHTML=`<div class="nm">Fasi del sonno, ultima notte</div><div class="v">${fmtDur(u.profondo+u.rem+u.leggero)} <small>dormito</small></div>`+
          `<div class="ph" role="img" aria-label="${ph.map(p=>p[1]+' '+fmtDur(u[p[0]])).join(', ')}">${ph.map(p=>`<i style="width:${(u[p[0]]/tot*100).toFixed(1)}%;background:${p[2]}"></i>`).join('')}</div>`+
          `<div class="cmp phl">${ph.map(p=>`<span><i style="background:${p[2]}"></i>${p[1]} <b>${fmtDur(u[p[0]])}</b>${m7?` <em>(media 7 g: ${fmtDur(m7[p[0]])})</em>`:''}</span>`).join('')}</div>`;
      }else{
        t.innerHTML=`<div class="nm">Fasi del sonno</div><div class="v" style="color:var(--label-2)">n.d.</div><div class="cmp">Nessun dato recente</div>`;
      }
      box.appendChild(t);return;
    }
    const s=(B.serie[df.k]||[]);
    if(!s.length){
      t.innerHTML=`<div class="nm">${df.nm}</div><div class="v" style="color:var(--label-2)">n.d. <small>${df.u}</small></div><div class="cmp">Nessun dato recente<br>&nbsp;</div>`;
      const svg=el('svg',{viewBox:'0 0 200 40',width:'100%',height:40,preserveAspectRatio:'none',role:'img','aria-label':`${df.nm}: dati non disponibili`});
      svg.appendChild(el('line',{x1:0,x2:200,y1:20,y2:20,stroke:'var(--separator)','stroke-width':2,'stroke-dasharray':'4 5','stroke-linecap':'round','vector-effect':'non-scaling-stroke'}));
      t.appendChild(svg);box.appendChild(t);return;
    }
    const last=s[s.length-1];
    const nmTxt=df.nm, vTxt=`${nf(last.valore,df.d)} <small>${df.u}</small>`;
    t.innerHTML=`<div class="nm">${nmTxt}</div><div class="v">${vTxt}</div><div class="cmp">Media 7 giorni: <b>${nf(last.media_7gg,df.d)}</b>${B.sintesi&&B.sintesi[df.sk]?`<br>4 settimane prima: ${nf(B.sintesi[df.sk].media_28gg_prec,df.d)}`:''}</div><div class="chart"></div>`;
    box.appendChild(t);
    const nmEl=t.querySelector('.nm'), vEl=t.querySelector('.v'), cbox=t.querySelector('.chart');
    const vs=s.map(x=>x.valore), ms=s.map(x=>x.media_7gg).filter(x=>x!=null);
    const all=vs.concat(ms), mn=Math.min(...all), rg=(Math.max(...all)-mn)||1;
    responsive(cbox,W=>{
      cbox.querySelector('svg')?.remove();
      const H=40, P=5, x=i=>P+i/(s.length-1||1)*(W-2*P), y=v=>H-4-(v-mn)/rg*(H-8);
      const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,height:H,role:'img','aria-label':`${df.nm}, ultimi ${s.length} giorni, ultimo valore ${nf(last.valore,df.d)} ${df.u}. Usa le frecce per scorrere i giorni.`});
      const pts=s.map((p,i)=>[x(i),p.media_7gg]).filter(p=>p[1]!=null);
      if(pts.length>1)svg.appendChild(el('path',{d:pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+y(p[1]).toFixed(1)).join(''),fill:'none',stroke:'var(--accent)','stroke-width':5,opacity:.18,'stroke-linecap':'round','stroke-linejoin':'round'}));
      svg.appendChild(el('path',{d:vs.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(''),fill:'none',stroke:'var(--accent)','stroke-width':1.75,'stroke-linecap':'round','stroke-linejoin':'round'}));
      svg.appendChild(el('circle',{cx:x(vs.length-1),cy:y(last.valore),r:3.5,fill:'var(--accent)',stroke:'var(--surface-2)','stroke-width':2}));
      const rule=el('line',{class:'mark',y1:0,y2:H,stroke:'var(--label-2)','stroke-width':1}), dot=el('circle',{class:'mark',r:4,fill:'var(--accent)',stroke:'var(--surface-2)','stroke-width':2});
      svg.append(rule,dot); cbox.appendChild(svg);
      /* Nei riquadri il numero grande diventa la lettura del giorno toccato, come in Salute. */
      scrub(svg,s.length,x,i=>{const px=x(i);rule.setAttribute('x1',px);rule.setAttribute('x2',px);dot.setAttribute('cx',px);dot.setAttribute('cy',y(vs[i]));
        t.classList.add('live');nmEl.textContent=fmtS(s[i].data);vEl.innerHTML=`${nf(vs[i],df.d)} <small>${df.u}</small>`},
        ()=>{t.classList.remove('live');nmEl.textContent=nmTxt;vEl.innerHTML=vTxt});
    });
  });
  $('#recEmpty').textContent=B.disponibile?'':'Dati non disponibili. Gli indicatori di recupero non sono stati scaricati.';
  (B.note||[]).forEach(n=>{const li=document.createElement('li');li.textContent=n;$('#recNotes').appendChild(li)});
})();

/* Attività: tabella su schermi larghi, lista a righe su telefono. */
(function(){
  const A=D.ultime_attivita, tb=$('#act tbody'), ul=$('#alist');
  $('#actLead').textContent=`Dal ${fmtS(A[A.length-1].data)} al ${fmtS(A[0].data)}`;
  A.forEach(a=>{
    const tipo=TIPI[a.tipo]||a.tipo, ora=a.data.slice(11);
    const tr=document.createElement('tr');

      <td><div class="nm2">${esc(a.nome)}</div><span class="tag">${esc(tipo)}</span></td>
      <td class="num">${a.distanza_km>0?nf(a.distanza_km,1):'-'}</td>
      <td class="num">${fmtDur(a.durata_min)}</td>
      <td class="num">${a.dislivello_m==null?'n.d.':nf(a.dislivello_m)}</td>
      <td class="num">${a.fc_media==null?'n.d.':nf(a.fc_media)}</td>`;
    tb.appendChild(tr);
    const li=document.createElement('li');
    li.innerHTML=`<div class="t">${esc(a.nome)}</div><div class="k">${a.distanza_km>0?`${nf(a.distanza_km,1)} <small>km</small>`:fmtDur(a.durata_min)}</div>
      <div class="d">${esc(tipo)} · ${fmtS(a.data)}, ${ora}</div><div class="m">${a.distanza_km>0?fmtDur(a.durata_min):''}${a.fc_media!=null?`${a.distanza_km>0?' · ':''}${nf(a.fc_media)} bpm`:''}</div>`;

  });
})();
